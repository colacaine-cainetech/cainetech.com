<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .menu {
        width: min(420px, 90vw);
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 2rem;
        text-align: center;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      li {
        padding: 14px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #f9fafb;
        text-align: center;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <h1>Games</h1>
      <ul>
        <li>Placeholder</li>
        <li>Placeholder</li>
        <li>Placeholder</li>
        <li>Placeholder</li>
        <li>Placeholder</li>
      </ul>
    </div>
  </body>
</html>
