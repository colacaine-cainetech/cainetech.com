<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Gisella's Ristorante</title>
  <style>
    :root {
      --primary: #8B0000;
      --secondary: #2C3E50;
      --accent: #D4AF37;
      --bg: #FAFAFA;
      --card-bg: #FFFFFF;
      --text: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    .hero-header {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('hero-bg.jpg') center/cover;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero-header h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .info-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      background: var(--secondary);
      color: white;
      padding: 15px;
      font-size: 0.9rem;
    }

    .menu-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .category-title {
      font-size: 1.8rem;
      color: var(--primary);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
      margin-top: 40px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .menu-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .menu-card:hover {
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .item-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--secondary);
    }

    .item-price {
      font-weight: bold;
      color: var(--primary);
    }

    .item-description {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header class="hero-header">
    <h1>Gisella's Ristorante</h1>
    <p>Authentic Italian recipes with dishes that are sure to please.</p>
  </header>

  <div class="info-bar">
    <span>📍 4 Starr Street, Danbury, CT 06810</span>
    <span>📞 203-456-6595</span>
    <span>🌐 www.gisellasonline.com</span>
  </div>

  <main class="menu-container">
    <h2 class="category-title">Appetizers</h2>
    <div class="menu-grid">
      <div class="menu-card">
        <div class="card-header">
          <span class="item-name">Classic Bruschetta</span>
          <span class="item-price">$11.95</span>
        </div>
        <p class="item-description">Grilled garlic bread topped with fresh diced tomatoes, basil, and extra virgin olive oil.</p>
      </div>
    </div>
  </main>

</body>
</html>
